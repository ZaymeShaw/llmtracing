    value: 就医绿通权益有哪些服务
    action: DIRECT_RAG
    tool: benefit_info
  - type: regex
    value: 安有医|安有护|臻享家医|御享国医|平安居家|高端康养|就医通|家族办公室|家办|私董保健医
