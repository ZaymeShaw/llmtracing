    value: 就医绿通怎么预约
    action: DIRECT_RAG
    tool: benefit_info
  - type: exact
    value: 在线问诊怎么预约
    action: DIRECT_RAG
    tool: benefit_info
  - type: exact
    value: 特色体检有哪些服务
    action: DIRECT_RAG
    tool: benefit_info
  - type: exact
    value: 居家康养服务介绍
    action: DIRECT_RAG
    tool: benefit_info
