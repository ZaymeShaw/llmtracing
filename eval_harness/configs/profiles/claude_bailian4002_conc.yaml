schema_version: "1.0"
profile_id: claude_code_mock_system_bailian4002_conc
harness: claude_code
project_cwd: ../../../workspaces/claude
bin: claude
agent_md: agent.md
mcp_config: .mcp.json
permission_mode: bypassPermissions
dangerously_skip_permissions: true
timeout_sec_per_turn: 300
idle_timeout_sec_per_turn: 600
turn_max_attempts: 2
concurrency: 4
workspace_isolation: none
# Layer-1: agent cwd per case = <agent_workdir_root>/<harness>/<execution_id>/ (outside repo;
# project_cwd above is only the template). Env EVAL_AGENT_WORKDIR_ROOT overrides.
agent_workdir_root: "~/eval_sandbox"
session_policy:
  new_session_per_case: true
  resume_within_case: true
output:
  eval_runs_dir: ../../../eval_runs
  keep_raw_stream: true
adapter:
  output_format: stream-json
  verbose: true
  include_partial_messages: true
  append_system_prompt: true
  extra_args: []
  claude_config_dir: per_case
notes: "Additive 2026-09-26: Claude→:4002 bailian + concurrency=4. Default claude.yaml untouched."
