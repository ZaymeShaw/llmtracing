schema_version: "1.0"
profile_id: pi_coding_local_relay_bailian_conc_cfgiso
harness: pi_coding
project_cwd: ../../../workspaces/pi
bin: pi
agent_md: agent.md
mcp_config: .mcp.json
timeout_sec_per_turn: 300
idle_timeout_sec_per_turn: 600
turn_max_attempts: 2
concurrency: 4
workspace_isolation: none
# Layer-1: agent cwd per case = <agent_workdir_root>/<harness>/<execution_id>/ (outside repo;
# project_cwd above is only the template). Env EVAL_AGENT_WORKDIR_ROOT overrides.
agent_workdir_root: "~/eval_sandbox"
session_policy:
  new_session_per_case: true
  resume_within_case: true
output:
  eval_runs_dir: ../../../eval_runs
  keep_raw_stream: true
adapter:
  output_format: json
  verbose: true
  append_system_prompt: true
  provider: local-relay-bailian
  model: deepseek-v4-flash-0731
  thinking: "off"
  no_builtin_tools: false
  approve: true
  extra_args: []
  # User-scope Pi config isolation (like claude.yaml claude_config_dir: per_case):
  # per_case -> PI_CODING_AGENT_DIR=<agent cwd>/.pi-agent with only this provider's models.json
  # block (apiKey stays an env reference) + settings {packages:[pi-mcp-adapter], retry};
  # --no-skills --no-prompt-templates --no-themes --no-context-files. inherit = legacy (~/.pi/agent).
  pi_agent_dir: per_case
  pi_packages: ["~/.pi/agent/npm/node_modules/pi-mcp-adapter"]
notes: "Additive 2026-09-28: pi_bailian_conc.yaml + pi_agent_dir=per_case (user ~/.pi/agent + ~/.agents/skills not loaded)."
